apiVersion: apps/v1
kind: Deployment

metadata:
  name: task-api

spec:
  replicas: 1

  selector:
    matchLabels:
      app: task-api

  template:
    metadata:
      labels:
        app: task-api

    spec:
      containers:
        - name: task-api
          image: YOUR_ECR_IMAGE_URI
          ports:
            - containerPort: 3000
envFrom:
  - configMapRef:
      name: task-api-config
  - secretRef:
      name: task-api-secret
